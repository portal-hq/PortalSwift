name: Publish the sdk
on:
  workflow_dispatch:
    inputs:
      version:
        description: "SDK Release Version (only if major or minor bump)"
        type: string
      hot_fix:
        description: "Is this release a hotfix?"
        type: boolean

# The pushes use GH_PAT, not GITHUB_TOKEN, so the job's own token needs nothing beyond the checkout.
permissions:
  contents: read

jobs:
  release_sdk:
    runs-on: macos-latest
    env:
      NEW_VERSION: ${{ inputs.version}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
        with:
          fetch-depth: 0
          path: main
          token: ${{ secrets.GH_PAT }}
          # Keep GH_PAT out of .git/config, where every later step, including the Slack action, could
          # read it. The steps that push hand it to their own git command through the environment
          # (see PUSH_AUTH_HEADER), so it is in neither the config file nor the process arguments.
          persist-credentials: false

      - name: Auto bump patch version
        if: ${{ !inputs.version}}
        run: |
          cd ${{ github.workspace }}/main
          export PODSPEC_FILE="PortalSwift.podspec"

          CURRENT_VERSION=$(grep -E 's.version\s*=\s*["'\''].*["'\'']' $PODSPEC_FILE | sed -E 's/^ *s.version *= *["'\''](.*)["'\'']/\1/')

          # Remove the pre-release tag and store it separately
          IFS='-' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          BASE_VERSION=${VERSION_PARTS[0]}
          PRE_RELEASE_TAG=${VERSION_PARTS[1]}
          echo "$BASE_VERSION $PRE_RELEASE_TAG"

          # Split the base version into major, minor, and patch versions using IFS
          IFS='.' read -ra BASE_VERSION_PARTS <<< "$BASE_VERSION"
          MAJOR_VERSION=${BASE_VERSION_PARTS[0]}
          MINOR_VERSION=${BASE_VERSION_PARTS[1]}
          PATCH_VERSION=${BASE_VERSION_PARTS[2]}
          echo "$MAJOR_VERSION $MINOR_VERSION $PATCH_VERSION"

          # Increment the patch version by 1
          NEW_PATCH_VERSION=$((PATCH_VERSION + 1))

          # Construct the new version string with the pre-release tag
          NEW_VERSION="$MAJOR_VERSION.$MINOR_VERSION.$NEW_PATCH_VERSION${PRE_RELEASE_TAG:+-$PRE_RELEASE_TAG}"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "$NEW_VERSION"

      # The version, whether typed in or computed, reaches shell commands, a git tag and the Slack
      # payloads below. Only a semantic version's characters are allowed, so it cannot carry quotes
      # or shell syntax. The steps read it from the environment rather than pasting it into scripts.
      - name: Check the version
        env:
          RELEASE_VERSION: ${{ env.NEW_VERSION }}
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::The version must look like 1.2.3 or 1.2.3-beta.1, got: $RELEASE_VERSION"
            exit 1
          fi

      - name: Push new version
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          RELEASE_VERSION: ${{ env.NEW_VERSION }}
        run: |
          cd ${{ github.workspace }}/main
          git config --local user.name "portal-release-bot"
          git config --local user.email "release-bot@portalhq.io"

          # Update the version in the podspec file
          export PODSPEC_FILE="PortalSwift.podspec"

          sed -i.bak -E "s/^( *s.version *= *).*/\1\"$RELEASE_VERSION\"/" "$PODSPEC_FILE"
          rm "$PODSPEC_FILE.bak"

          # Print the first 4 lines of the podspec file
          head -n 4 "$PODSPEC_FILE"

          # Update the version file
          ./scripts/update_version_file.sh "$RELEASE_VERSION"

          git add -A
          git commit -m "Bump version to $RELEASE_VERSION"

          # The header actions/checkout would have persisted, given to this push only.
          PUSH_AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PAT" | base64 | tr -d '\n')"
          echo "::add-mask::${PUSH_AUTH_HEADER#AUTHORIZATION: basic }"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="$PUSH_AUTH_HEADER" git push

      - name: Tag repo with new version
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          RELEASE_VERSION: ${{ env.NEW_VERSION }}
        run: |
          cd ${{ github.workspace }}/main
          git config --local user.name "portal-release-bot"
          git config --local user.email "release-bot@portalhq.io"

          git tag -a "$RELEASE_VERSION" -m "Version $RELEASE_VERSION"

          PUSH_AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PAT" | base64 | tr -d '\n')"
          echo "::add-mask::${PUSH_AUTH_HEADER#AUTHORIZATION: basic }"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="$PUSH_AUTH_HEADER" git push origin "$RELEASE_VERSION"

      - name: Slack - send pod published
        if: ${{ inputs.hot_fix == false }}
        uses: slackapi/slack-github-action@007b2c3c751a190b6f0f040e47ed024deaa72844 # v1.23.0
        with:
          # NEW_VERSION passed "Check the version", so it is safe inside this JSON.
          payload: |
            {
            "Title": "**Swift SDK ${{ env.NEW_VERSION }} Published**",
            "Body": "The Swift SDK has been published with version: ${{ env.NEW_VERSION }}.\n",
            "Status": "Success"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Slack - send hotfix pod published
        if: ${{ inputs.hot_fix == true }}
        uses: slackapi/slack-github-action@007b2c3c751a190b6f0f040e47ed024deaa72844 # v1.23.0
        with:
          # NEW_VERSION passed "Check the version", so it is safe inside this JSON.
          payload: |
            {
            "Title": "**Swift SDK - Hotfix ${{ env.NEW_VERSION }} Published**",
            "Body": "The Swift SDK has been published with version: ${{ env.NEW_VERSION }}.\n Please merge the hotfix into release-candidate.\n",
            "Status": "Success"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Merge main to release-candidate
        if: ${{ inputs.hot_fix == false }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          cd ${{ github.workspace }}/main
          git config --local user.name "portal-release-bot"
          git config --local user.email "release-bot@portalhq.io"
          git checkout release-candidate

          git merge -X theirs -m "merge main into release-candidate" main

          PUSH_AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PAT" | base64 | tr -d '\n')"
          echo "::add-mask::${PUSH_AUTH_HEADER#AUTHORIZATION: basic }"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="$PUSH_AUTH_HEADER" git push
