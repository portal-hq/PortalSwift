name: Run Swift Unit Tests

on: [push, workflow_dispatch]

# Checkout only reads the repository; the cache and artifact actions use the runner's own token and
# Codecov uses CODECOV_TOKEN, so GITHUB_TOKEN needs nothing more (the repository default is write).
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26-xlarge

    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0

      - name: Cache Xcode Derived Data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-derived-data-${{ github.run_number }}
          restore-keys: |
            ${{ runner.os }}-derived-data-

      - name: Run Tests
        run: |
          xcodebuild -quiet -scheme Unit\ Tests -workspace .swiftpm/xcode/package.xcworkspace test -sdk iphonesimulator -destination 'platform=iOS Simulator,arch=arm64,name=iPhone 17' -resultBundlePath TestResults.xcresult

      # -quiet keeps the log short but drops assertion messages, so print each failure's message
      # from the result bundle. Xcode 16 and later need --legacy for this JSON; Xcode 15 rejects it.
      - name: Show test failures
        if: failure()
        run: |
          [ -d TestResults.xcresult ] || exit 0
          xcrun xcresulttool get --legacy --path TestResults.xcresult --format json > TestResults.json 2>/dev/null \
            || xcrun xcresulttool get --path TestResults.xcresult --format json > TestResults.json
          jq -r '.issues.testFailureSummaries._values[]? | "\(.testCaseName._value): \(.message._value)"' TestResults.json

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e156083f13aff6830c92fc5faa23505779fbf649 # v1.2.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
